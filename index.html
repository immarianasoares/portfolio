  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

color-bg:          var(--sp-white);\n  --color-bg-alt:      var(--sp-gray-light);\n  --color-bg-warm:     var(--sp-off-white);\n  --color-bg-inverse:  var(--sp-black);\n\n  --color-fg:          var(--sp-black);\n  --color-fg-muted:    var(--sp-gray-mid);\n  --color-fg-inverse:  var(--sp-white);\n\n  --color-accent:      var(--sp-fuchsia);\n  --color-accent-dark: var(--sp-fuchsia-dark);\n  --color-accent-soft: var(--sp-fuchsia-light);\n\n  --color-border:      color-mix(in oklab, var(--sp-black) 10%, transparent);\n  --color-border-strong: color-mix(in oklab, var(--sp-black) 20%, transparent);\n\n  /* -------------------- Type families ------------------------------------- */\n  --font-display: \"ES Build\", \"Inter Tight\", system-ui, sans-serif; /* Titles, headers, labels */\n  --font-body:    \"Manrope\", system-ui, -apple-system, Segoe UI, sans-serif; /* All body copy */\n  --font-mono:    ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* -------------------- Type scale (px values scale down for web) --------- */\n  /* Brand-spec print sizes preserved via --*-pt; web sizes are pragmatic. */\n  --fs-display-pt: 130pt;   /* @kind font */ /* Brand: Large Titles (ES Build Regular) */\n  --fs-subtitle-pt: 50pt;   /* @kind font */ /* Brand: Sub-titles (ES Build Regular) */\n  --fs-header-pt: 32pt;     /* @kind font */ /* Brand: Headers (ES Build SemiBold) */\n  --fs-paragraph-pt: 28pt;  /* @kind font */ /* Brand: Paragraph (Manrope Regular) */\n\n  --fs-display:  clamp(3.75rem, 8vw, 8.125rem); /* @kind font */ /* ≈ 60-130px */\n  --fs-h1:       clamp(2.5rem, 4.5vw, 4rem); /* @kind font */\n  --fs-h2:       clamp(1.875rem, 3vw, 2.75rem); /* @kind font */\n  --fs-h3:       1.5rem;     /* @kind font */ /* 24px */\n  --fs-h4:       1.25rem;    /* @kind font */ /* 20px */\n  --fs-body-lg:  1.25rem;    /* @kind font */ /* 20px */\n  --fs-body:     1rem;       /* @kind font */ /* 16px */\n  --fs-body-sm:  0.875rem;   /* @kind font */ /* 14px */\n  --fs-caption:  0.75rem;    /* @kind font */ /* 12px */\n\n  --lh-display:  1.1;  /* @kind font */ /* Brand: headline ×1.1 */\n  --lh-heading:  1.2;  /* @kind font */ /* Brand: subhead  ×1.2 */\n  --lh-body:     1.4;  /* @kind font */ /* Brand: body     ×1.4 */\n\n  /* -------------------- Spacing (4pt grid) -------------------------------- */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n  --space-10: 128px;\n\n  /* -------------------- Radii (10px default, pill for capsules) ---------- */\n  --radius-0:  10px;   /* default - never use square corners */\n  --radius-sm: 10px;\n  --radius-md: 10px;\n  --radius-lg: 10px;\n  --radius-pill: 999px;\n\n  /* -------------------- Elevation (restrained; brand is mostly flat) ------ */\n  --shadow-sm: 0 1px 2px rgba(6,6,6,0.06), 0 1px 3px rgba(6,6,6,0.04);\n  --shadow-md: 0 4px 12px rgba(6,6,6,0.08);\n  --shadow-lg: 0 20px 40px rgba(6,6,6,0.14);\n\n  /* -------------------- Motion -------------------------------------------- */\n  --ease-standard: cubic-bezier(0.2, 0.7, 0.2, 1); /* @kind other */\n  --ease-emphasis: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 220ms; /* @kind other */\n  --dur-slow: 420ms; /* @kind other */\n}\n\n/* ---------- Dark inverse context ---------- */\n.sp-inverse, [data-theme=\"dark\"] {\n  --color-bg:          var(--sp-black);\n  --color-bg-alt:      var(--sp-gray-dark);\n  --color-bg-warm:     var(--sp-gray-dark);\n  --color-bg-inverse:  var(--sp-white);\n\n  --color-fg:          var(--sp-white);\n  --color-fg-muted:    color-mix(in oklab, var(--sp-white) 65%, transparent);\n  --color-fg-inverse:  var(--sp-black);\n\n  --color-border:      color-mix(in oklab, var(--sp-white) 14%, transparent);\n  --color-border-strong: color-mix(in oklab, var(--sp-white) 28%, transparent);\n}\n\n/* ---------- Base reset (lightweight) ---------- */\nhtml { -webkit-text-size-adjust: 100%; }\nbody {\n  margin: 0;\n  background: var(--color-bg);\n  color: var(--color-fg);\n  font-family: var(--font-body);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* ---------- Global widow rule --------------------------------------------\n   Never leave a single word alone on the last line. `text-wrap: pretty`\n   asks the browser to re-balance the final lines to avoid widows. Applies\n   to every headline, paragraph, quote, caption in the system. */\nh1, h2, h3, h4, h5, h6,\np, blockquote, figcaption, li,\n.sp-display, .sp-subtitle, .sp-header, .sp-body, .sp-body-lg, .sp-caption {\n  text-wrap: pretty;\n}\n\n/* ---------- Semantic typography classes -------------------------------- */\n.sp-display, h1.sp-display {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: var(--fs-display);\n  line-height: var(--lh-display);\n  letter-spacing: -0.01em;\n  text-transform: none; /* always sentence case */\n}\n.sp-subtitle {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: var(--fs-h2);\n  line-height: var(--lh-heading);\n  letter-spacing: -0.005em;\n}\n.sp-header, h2.sp-header, h3.sp-header {\n  font-family: var(--font-display);\n  font-weight: 600;\n  font-size: var(--fs-h3);\n  line-height: var(--lh-heading);\n  letter-spacing: 0;\n}\n.sp-eyebrow {\n  font-family: var(--font-display);\n  font-weight: 500;\n  font-size: var(--fs-caption);\n  line-height: 1;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n}\n.sp-section-num {\n  font-family: var(--font-display);\n  font-weight: 400;\n  color: var(--color-accent);\n  font-size: var(--fs-h4);\n  letter-spacing: 0.04em;\n}\n.sp-body, p {\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n}\n.sp-body-lg {\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: var(--fs-body-lg);\n  line-height: var(--lh-body);\n}\n.sp-caption {\n  font-family: var(--font-body);\n  font-size: var(--fs-caption);\n  line-height: 1.35;\n  color: var(--color-fg-muted);\n}\n.sp-stat {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: clamp(3rem, 6vw, 5.5rem);\n  line-height: 1;\n  color: var(--color-accent);\n  letter-spacing: -0.02em;\n}\n.sp-slide-number {\n  font-family: var(--font-body);\n  font-weight: 600;\n  font-size: 12px;\n  letter-spacing: 0.04em;\n}\n\n/* ---------- Brand motifs -------------------------------------------------- */\n/* Content anchor - fuchsia dot placed before key text blocks. */\n.sp-anchor::before {\n  content: \"\";\n  display: inline-block;\n  width: 0.45em;\n  height: 0.45em;\n  background: var(--color-accent);\n  border-radius: 50%;\n  margin-right: 0.5em;\n  vertical-align: middle;\n  transform: translateY(-0.08em);\n}\n\n/* Inline fuchsia key-phrase highlight (use 2-4 per slide, never whole sentences) */\n.sp-key {\n  color: var(--color-accent);\n}\n<\u002Fstyle>\n<script src=\"2b2c0ddb-73ff-42ad-becb-dfe91da37fb6\"><\u002Fscript>\n<script src=\"da244e08-ed9a-4b92-a2a3-a68aa0a9d168\"><\u002Fscript>\n<style>\n  html { scroll-behavior: smooth; scroll-padding-top: 88px; }\n  body { margin: 0; background: #F1EBE1; }\n  @keyframes spRise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }\n  a { color: inherit; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div ref=\"{{ setRoot }}\" data-screen-label=\"Portfolio\" style=\"--accent:#AD011D; --accent-2:color-mix(in oklab, var(--accent), #ffffff 32%); --ink:#060606; --ink2:#202123; --muted:#56585E; --paper:#ffffff; --warm:#F1EBE1; --border:rgba(6,6,6,0.10); --border-strong:rgba(6,6,6,0.20); font-family:'Manrope',system-ui,sans-serif; color:#060606; background:var(--warm); overflow-x:hidden; line-height:1.4;\">\n\n  <!-- NAV -->\n  <nav style=\"position:sticky; top:0; z-index:50; display:flex; align-items:ce ;\">\n          <span style=\"width:8px; height:8px; border-radius:50%; background:var(--accent-2); display:inline-block;\"><\u002Fspan>\n          <span style=\"font-family:'ES Build',sans-serif; font-weight:500; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(255,255,255,0.72);\">Lisbon · Marketing &amp; creative<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"font-family:'ES Build',sans-serif; font-weight:400; font-size:clamp(2.7rem,6.4vw,5rem); line-height:1.04; letter-spacing:-0.015em; margin:0 0 22px;\">Mariana<br>Félix Soares<\u002Fh1>\n        <p style=\"font-size:clamp(1.05rem,1.8vw,1.32rem); line-height:1.5; color:rgba(255,255,255,0.82); max-width:30ch; margin:0 0 14px;\">Marketing manager at <span style=\"color:var(--accent-2);\">ScorePlay<\u002Fspan> and freelance creative.<\u002Fp>\n        <p style=\"font-size:clamp(0.98rem,1.4vw,1.08rem); line-height:1.55; color:rgba(255,255,255,0.60); max-width:46ch; margin:0 0 32px;\">I build brands end to end, from strategy and PR to the content people actually stop to watch.<\u002Fp>\n        <div style=\"display:flex; gap:12px; flex-wrap:wrap;\">\n          <a href=\"#contact\" style=\"font-size:15px; font-weight:600; color:#fff; background:var(--accent); padding:13px 24px; border-radius:10px; text-decoration:none; transition:background 160ms cubic-bezier(0.2,0.7,0.2,1), transform 160ms;\" style-hover=\"background:color-mix(in oklab, var(--accent), #000 24%);\" style-active=\"transform:scale(0.99);\">Work with me<\u002Fa>\n          <a href=\"#instagram\" style=\"font-size:15px; font-weight:600; color:#fff; background:transparent; padding:13px 24px; border-radius:10px; text-decoration:none; border:1px solid rgba(255,255,255,0.28); transition:border-color 160ms, background 160ms;\" style-hover=\"border-color:rgba(255,255,255,0.6); background:rgba(255,255,255,0.06);\">See the numbers<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:0 0 auto; margin:0 auto;\">\n        <image-slot id=\"hero-photo\" shape=\"circle\" src=\"23c16d56-1677-40e5-8f1f-4f13cb57f4af\" placeholder=\"Upload your photo\" style=\"display:block; width:clamp(230px,32vw,360px); height:clamp(230px,32vw,360px);\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- hero stat strip -->\n    <div style=\"max-width:1180px; margin:clamp(40px,6vw,72px) auto 0; padding-top:clamp(28px,4vw,40px); border-top:1px solid rgba(255,255,255,0.14); display:flex; flex-wrap:wrap; gap:clamp(28px,5vw,64px);\">\n      <div>\n        <div style=\"font-family:'ES Build',sans-serif; font-size:clamp(1.7rem,3vw,2.4rem); line-height:1; color:var(--accent-2);\">72.2k<\u002Fdiv>\n        <div style=\"font-size:13px; color:rgba(255,255,255,0.6); margin-top:8px;\">Instagram views, last 30 days<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'ES Build',sans-serif; font-size:clamp(1.7rem,3vw,2.4rem); line-height:1; color:var(--accent-2);\">37k+<\u002Fdiv>\n        <div style=\"font-size:13px; color:rgba(255,255,255,0.6); margin-top:8px;\">Accounts reached<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'ES Build',sans-serif; font-size:clamp(1.7rem,3vw,2.4rem); line-height:1; color:var(--accent-2);\">100k+<\u002Fdiv>\n        <div style=\"font-size:13px; color:rgba(255,255,255,0.6); margin-top:8px;\">Monthly LinkedIn impressions<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ABOUT -->\n  <section id=\"about\" style=\"padding:clamp(64px,9vw,128px) clamp(20px,6vw,96px); background:var(--warm);\">\n    <div style=\"max-width:1180px; margin:0 auto;\">\n      <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:28px;\">\n        <span style=\"font-family:'ES Build',sans-serif; font-size:18px; color:var(--accent); letter-spacing:0.04em;\">01<\u002Fspan>\n        <span style=\"font-family:'ES Build',sans-serif; font-weight:500; font-size:12px; letter-spacing:0.14em; text-transf
